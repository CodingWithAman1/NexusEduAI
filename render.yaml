services:
  - type: web
    name: nexusedu-ai
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: FACULTY_INVITE_CODE
        value: FACULTY2026
